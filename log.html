<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pallino log · gioalberodev</title>
<meta name="description" content="Every update to Pallino, newest first.">
<link rel="icon" href="img/favicon.png">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1E2148;
    --soft: #8A8DA8;
    --line: #E6E7F0;
    --card: #F6F7FB;
    --ghost: #E9EAF2;
    --accent: #4B4EFC;
    --coral: #FF6B57;
    --yellow: #FFC531;
    --violet: #8B5CF6;
    --sky: #38BDF8;
    --mint: #34D399;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E0F1E;
      --ink: #E9EAF6;
      --soft: #8C8FAE;
      --line: #23253D;
      --card: #16182C;
      --ghost: #24263D;
      --accent: #8F91FF;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.65 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  main { max-width: 780px; margin: 0 auto; padding: 56px 16px 64px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .soft { color: var(--soft); }

  .dots { display: flex; gap: 7px; margin-bottom: 26px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: var(--coral); }
  .dots i:nth-child(2) { background: var(--yellow); }
  .dots i:nth-child(3) { background: var(--mint); }

  .hero { display: flex; align-items: center; gap: 28px; }
  .hero-text { flex: 1; min-width: 0; }
  h1 { font-size: 32px; margin: 0; letter-spacing: -0.5px; }
  h1 .cursor { display: inline-block; width: 0.55em; height: 1.05em; margin-left: 4px;
    background: var(--accent); vertical-align: -0.15em; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .tagline { margin: 10px 0 0; }
  .me { margin: 10px 0 0; color: var(--soft); }
  #pallino-live { width: 168px; height: 168px; flex: none; cursor: pointer; }
  .hint { font-size: 12px; color: var(--soft); text-align: center; margin-top: 2px; }

  .block { margin-top: 48px; }
  .prompt { color: var(--soft); margin: 0 0 12px; overflow-wrap: anywhere; }
  .prompt b { color: var(--accent); font-weight: 600; }
  .prompt::before { content: "~/gioalberodev $ "; color: var(--mint); }

  .project {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 18px;
    padding: 22px;
  }
  .head { display: flex; gap: 16px; align-items: center; }
  .head img { width: 64px; height: 64px; border-radius: 15px; flex: none; }
  .head h2 { margin: 0; font-size: 20px; }
  .head p { margin: 2px 0 0; color: var(--soft); }
  .status { margin: 16px 0 0; font-size: 13.5px; }
  .status .k { color: var(--soft); }
  .status .on { color: var(--mint); }
  .status .wip { color: var(--yellow); }
  .features { list-style: none; padding: 0; margin: 16px 0 0; }
  .features li { padding-left: 1.4em; text-indent: -1.4em; }
  .features li::before { content: "● "; }
  .features li:nth-child(5n+1)::before { color: var(--yellow); }
  .features li:nth-child(5n+2)::before { color: var(--coral); }
  .features li:nth-child(5n+3)::before { color: var(--violet); }
  .features li:nth-child(5n+4)::before { color: var(--sky); }
  .features li:nth-child(5n+5)::before { color: var(--mint); }
  .shots { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin-top: 18px; align-items: end; }
  .shots img { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; }
  .shots .phone { width: 150px; border-radius: 22px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 18px; }
  .links a::before { content: "→ "; color: var(--soft); }

  .log { list-style: none; padding: 0; margin: 0; font-size: 14px; }
  .log li { display: grid; grid-template-columns: 7.5ch 11ch 1fr; gap: 12px; padding: 2px 0; }
  .log .hash { color: var(--yellow); }
  .log .date { color: var(--soft); }
  .log li.head .msg::after { content: "  (HEAD)"; color: var(--mint); }
  .log-more { display: inline-block; margin-top: 10px; font-size: 14px; }
  .log-more::before { content: "→ "; color: var(--soft); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--card); }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12.5px; color: var(--soft); }

  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li::before { content: "– "; color: var(--soft); }
  ul.plain li.ok::before { content: "✓ "; color: var(--mint); }

  footer { margin-top: 56px; color: var(--soft); font-size: 13px; border-top: 1px solid var(--line); padding-top: 18px; }

  @media (max-width: 600px) {
    main { padding-top: 32px; }
    .hero { flex-direction: column-reverse; align-items: flex-start; gap: 8px; }
    #pallino-live { width: 128px; height: 128px; }
    .hint { text-align: left; }
    h1 { font-size: 26px; }
    .shots { grid-template-columns: 1fr; }
    .shots .phone { width: 46%; justify-self: center; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .log li { grid-template-columns: 7.5ch 1fr; }
    .log .date { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { h1 .cursor { animation: none; } }
  .crumb { color: var(--soft); font-size: 13.5px; margin: 0 0 14px; }
</style>
</head>
<body>
<main>
  <div class="dots"><i></i><i></i><i></i></div>
  <p class="crumb"><a href="./">~/gioalberodev</a> / <a href="./#pallino">pallino</a> / log</p>
  <h1>git log<span class="cursor"></span></h1>
  <p class="tagline soft">Every update to Pallino, newest first.</p>

  <section class="block">
    <p class="prompt"><b>git log</b> --oneline pallino</p>
    <ul class="log"></ul>
    <a class="log-more" href="./">back to gioalberodev</a>
  </section>

  <footer>© 2026 Giovanni Albero · handwritten HTML, no frameworks, no trackers</footer>
</main>
<script src="log.js"></script>
</body>
</html>
